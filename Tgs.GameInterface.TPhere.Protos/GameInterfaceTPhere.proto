syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.TPhere.Protos";

package GameInterfaceTPhere;

// The greeting service definition.
service GameInterfaceTPhere {
  // Sends a greeting
  rpc TP2PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc TP2PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc TP2PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc TP2PlayerOnline (PlayerOnlineRequest) returns (PlayerOnlineReply);
  rpc TP2FundIn (FundRequest) returns (FundReply);
  rpc TP2FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc TP2GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc TP2GameWagerBetLogByBettime (GameWagerRequest) returns (GameWagerReply);
  rpc TP2GameWagerBetLog (GameWagerRequest) returns (GameWagerReply);
  rpc TP2GameWagerDetail (GameWagerDetailRequest) returns (GameWagerDetailReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.

message PlayerBalanceRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string player_code = 4;
}

message PlayerCreateRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string player_code = 4;
}

message PlayerOnlineRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string player_code = 4;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string player_code = 4;
}

message FundRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string player_code = 4;
	string order_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string order_id = 4;
}

message GameUrlRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string player_code = 4;
	string game_code = 5;
	bool is_mobile = 6;
	string language = 7;
}

message GameWagerRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	google.protobuf.Timestamp start_time = 4;
	google.protobuf.Timestamp end_time = 5;
	int32 page = 6;
	int32 page_size = 7;
}

message GameWagerDetailRequest {
	string api_url = 1;
	string api_key = 2;
	string api_token = 3;
	string external_wager_id = 4;
	google.protobuf.Timestamp external_created_on = 5;
	string language = 6;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message PlayerOnlineReply {
	bool online = 1;
}

message FundReply {
	string transaction_id = 1;
	string casino_trans_id = 2;
	phoenix.protobuf.DecimalValue balance = 3;
	string res = 4;
}

message GameUrlReply{
	bool is_player_exist = 1;
	string game_url = 2;
}

message GameWagerDetailReply{
	string game_wager_detail_url = 1;
}

message GameWagerReply {
	repeated GameWagerInfo items = 1;
}

message  GameWagerInfo {
	string external_round_id = 1;
	string external_wager_id = 2;
	string external_game_id = 3;
    string player_code = 4;
	bool is_closed = 5;
	bool is_void = 6;
	bool is_free_game = 7;
	bool is_resettle = 8;
	google.protobuf.Timestamp external_created_on = 9;
	google.protobuf.Timestamp external_closed_on = 10;
	phoenix.protobuf.DecimalValue bet = 11;
	phoenix.protobuf.DecimalValue valid_bet = 12;
	phoenix.protobuf.DecimalValue settle = 13;
	phoenix.protobuf.DecimalValue win_loss = 14;
	phoenix.protobuf.DecimalValue jackpot = 15;
	string additional_data = 16;
}

message CheckingServiceReply{
    string machine_name = 1;
}